<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Raven of the Celestials</title>
  <style>
    :root { color-scheme: dark; --ink:#102838; --gold:#f1c65b; --paper:#fff8dd; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Georgia,serif; color:#fff; background:#102836 radial-gradient(circle at 50% 10%,#415f72 0,transparent 48%); }
    .game-shell { width:min(100%,1100px); padding:18px; display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; }
    .game-card { position:relative; overflow:hidden; border:5px solid #d9aa43; border-radius:20px; box-shadow:0 18px 45px #000a; background:#70a4af; }
    canvas { width:100%; display:block; aspect-ratio:16/9; touch-action:manipulation; cursor:pointer; }
    .hud { position:absolute; inset:0; pointer-events:none; padding:20px; display:flex; justify-content:space-between; align-items:flex-start; text-shadow:2px 2px 0 #132431; }
    .title { font-weight:bold; letter-spacing:.06em; font-size:clamp(13px,2vw,20px); max-width:55%; }
    .score { font:bold clamp(34px,6vw,62px) system-ui,sans-serif; }
    .panel { align-self:start; background:linear-gradient(145deg,#fff7d9,#e7c878); color:var(--ink); border:4px solid #8d682b; padding:18px; border-radius:14px; box-shadow:0 12px 30px #0008; }
    .panel h2 { margin:0 0 10px; font-size:20px; } .panel p { margin:0 0 14px; font-size:14px; }
    .scores { max-height:430px; overflow:auto; padding-left:0; margin:0; list-style:none; font-family:system-ui,sans-serif; }
    .scores li { padding:9px 0; border-bottom:1px solid #b9924d; display:flex; justify-content:space-between; gap:8px; }
    .scores small { display:block; opacity:.65; margin-top:2px; }
    .status { margin-top:13px!important; font-size:12px!important; color:#65501e; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:25px; background:rgba(16,40,56,.44); }
    .dialog { width:min(420px,100%); text-align:center; color:var(--ink); padding:28px; border:5px solid #d9aa43; border-radius:18px; background:var(--paper); box-shadow:0 12px 35px #0008; }
    .dialog h1 { margin:0 0 8px; font-size:28px; } .dialog p { margin:7px 0 19px; }
    input,button { font:inherit; } input { width:100%; padding:12px; border:2px solid #85622c; border-radius:8px; font-size:17px; }
    button { margin-top:12px; padding:11px 20px; border:0; border-radius:8px; cursor:pointer; background:#1c647b; color:#fff; font-weight:bold; }
    button:hover { background:#144c60; } .hint { font-size:13px; opacity:.75; }
    @media (max-width:800px){ .game-shell{grid-template-columns:1fr;padding:8px;gap:10px}.panel{order:2}.scores{max-height:230px} }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="game-card" aria-label="Игра Flappy Raven">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="hud"><div class="title">FLAPPY RAVEN<br>OF THE CELESTIALS</div><div class="score" id="score">0</div></div>
      <div class="overlay" id="overlay"><form class="dialog" id="startForm"><h1>Flappy Raven</h1><p>Проведи синего ворона через зачарованные башни и собирай небесные знамёна.</p><input id="nickname" maxlength="28" required placeholder="Ваш никнейм" autocomplete="nickname"><button type="submit">Начать полёт</button><p class="hint">Пробел, ↑, клик или касание — взмах крыла</p></form></div>
    </section>
    <aside class="panel"><h2>Все полёты</h2><p>Каждый результат сохраняется, а не только лучшие.</p><ol id="scores" class="scores"><li>Загрузка…</li></ol><p class="status" id="status"></p></aside>
  </main>
<script>
const SUPABASE_URL='https://axgdwlhbdckqwrgmotzq.supabase.co';
const SUPABASE_KEY='sb_publishable_VqRzl_g0rpCv-IQwhWRabg_fxM9D8rK';
const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),overlay=document.querySelector('#overlay'),form=document.querySelector('#startForm'),nameEl=document.querySelector('#nickname'),scoresEl=document.querySelector('#scores'),statusEl=document.querySelector('#status');
const bg=new Image(),banner=new Image(); bg.src='assets/treehouse-background.jpeg'; banner.src='assets/celestial-banner.png';
const PIPE_GAP=190,PIPE_SPEED=2.65;
let nick='',playing=false,ended=false,score=0,frames=0,bird,pipes=[],badges=[];
const pipeTypes=[['#e3bd36','badger'],['#318b4b','snake'],['#367bb8','raven'],['#b64039','lion']];
function reset(){ score=0;frames=0;pipes=[];badges=[];bird={x:190,y:250,vy:0,r:18,tilt:0};scoreEl.textContent='0'; }
function flap(){if(!playing)return;bird.vy=-8.4;}
function drawRaven(){x.save();x.translate(bird.x,bird.y);x.rotate(Math.max(-.45,Math.min(.8,bird.vy*.07))); x.fillStyle='#196cad';x.beginPath();x.ellipse(0,2,22,14,0,0,Math.PI*2);x.fill(); x.beginPath();x.moveTo(-5,4);x.quadraticCurveTo(-40,-12,-28,20);x.quadraticCurveTo(-9,20,8,12);x.fill();x.fillStyle='#0b2945';x.beginPath();x.arc(12,-6,11,0,Math.PI*2);x.fill();x.fillStyle='#e4c153';x.beginPath();x.moveTo(22,-5);x.lineTo(34,0);x.lineTo(22,4);x.fill();x.fillStyle='white';x.beginPath();x.arc(15,-9,3,0,7);x.fill();x.fillStyle='#102233';x.beginPath();x.arc(16,-9,1.3,0,7);x.fill();x.restore();}
function animal(cx,cy,type){x.save();x.translate(cx,cy);x.fillStyle='rgba(12,23,26,.82)';x.strokeStyle=x.fillStyle;x.lineWidth=7;x.lineCap='round';if(type==='snake'){x.beginPath();x.moveTo(-24,15);x.bezierCurveTo(25,15,-24,-8,21,-14);x.stroke();x.beginPath();x.arc(22,-14,7,0,7);x.fill();}else if(type==='raven'){x.beginPath();x.ellipse(0,6,16,10,0,0,7);x.fill();x.beginPath();x.moveTo(-5,5);x.lineTo(-28,-12);x.lineTo(-13,18);x.fill();x.beginPath();x.arc(10,-7,8,0,7);x.fill();x.beginPath();x.moveTo(17,-7);x.lineTo(30,-2);x.lineTo(17,1);x.fill();}else if(type==='lion'){x.beginPath();x.arc(0,0,23,0,7);x.fill();x.fillStyle='#b64039';x.beginPath();x.arc(0,0,13,0,7);x.fill();x.fillStyle='rgba(12,23,26,.82)';x.beginPath();x.arc(-12,-20,7,0,7);x.arc(12,-20,7,0,7);x.fill();}else{x.beginPath();x.ellipse(0,4,24,12,0,0,7);x.fill();x.fillRect(-27,-3,11,7);x.beginPath();x.arc(12,-8,10,0,7);x.fill();x.fillStyle='#e3bd36';x.fillRect(-4,-17,8,29);x.fillStyle='rgba(12,23,26,.82)';}x.restore();}
function drawPipe(p){const top=p.y, bottom=p.y+PIPE_GAP,w=92; x.fillStyle=p.color;x.fillRect(p.x,0,w,top);x.fillRect(p.x, bottom,w,c.height-bottom);x.fillStyle='rgba(255,255,255,.23)';x.fillRect(p.x+9,0,8,top);x.fillRect(p.x+9,bottom,8,c.height-bottom);x.fillStyle=p.color;x.fillRect(p.x-7,top-20,w+14,20);x.fillRect(p.x-7,bottom,w+14,20);animal(p.x+w/2,top-42,p.animal);animal(p.x+w/2,bottom+42,p.animal);}
function drawBadge(b){x.save();x.translate(b.x,b.y);x.rotate(Math.sin(frames*.08+b.x)*.1);x.beginPath();x.arc(0,0,24,0,7);x.clip();x.drawImage(banner,-37,-32,74,67);x.restore();x.strokeStyle='#f1c65b';x.lineWidth=3;x.beginPath();x.arc(b.x,b.y,25,0,7);x.stroke();}
function collide(){if(bird.y+bird.r>c.height||bird.y-bird.r<0)return true; for(const p of pipes){if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+92&&(bird.y-bird.r<p.y||bird.y+bird.r>p.y+PIPE_GAP))return true;}return false;}
function tick(){x.clearRect(0,0,c.width,c.height); if(bg.naturalWidth>0)x.drawImage(bg,0,0,c.width,c.height);else{x.fillStyle='#91bcc4';x.fillRect(0,0,c.width,c.height)}x.fillStyle='rgba(7,39,42,.10)';x.fillRect(0,0,c.width,c.height); if(playing){frames++;if(frames<=65)bird.vy=0;else bird.vy+=.25;bird.y+=bird.vy;bird.tilt=bird.vy*.07;if(frames%120===0){const type=pipeTypes[Math.floor(Math.random()*4)],y=70+Math.random()*190;pipes.push({x:c.width+50,y,color:type[0],animal:type[1],passed:false});if(Math.random()<.78)badges.push({x:c.width+96,y:y+PIPE_GAP/2});}pipes.forEach(p=>{p.x-=PIPE_SPEED;if(!p.passed&&p.x+92<bird.x){p.passed=true;score++;scoreEl.textContent=score;}});badges.forEach(b=>{b.x-=PIPE_SPEED;if(!b.hit&&Math.hypot(b.x-bird.x,b.y-bird.y)<42){b.hit=true;score+=3;scoreEl.textContent=score;}});pipes=pipes.filter(p=>p.x>-100);badges=badges.filter(b=>b.x>-50&&!b.hit);if(collide())finish();}pipes.forEach(drawPipe);badges.forEach(drawBadge);drawRaven();requestAnimationFrame(tick);}
async function loadScores(){try{let data=[],from=0;while(true){const r=await fetch(SUPABASE_URL+'/rest/v1/flappy_scores?select=nickname,score,created_at&order=created_at.desc',{headers:{...headers,Range:`${from}-${from+999}`}});if(!r.ok)throw Error();const page=await r.json();data=data.concat(page);if(page.length<1000)break;from+=1000;}scoresEl.innerHTML=data.length?data.map(s=>`<li><span>${escapeHtml(s.nickname)}<small>${new Date(s.created_at).toLocaleString('ru-RU')}</small></span><strong>${s.score}</strong></li>`).join(''):'<li>Полётов пока нет.</li>';statusEl.textContent='Показаны все '+data.length+' результатов.'}catch{scoresEl.innerHTML='<li>Таблица ещё не подключена.</li>';statusEl.textContent='Выполните SQL из файла supabase-setup.sql.'}}
function escapeHtml(s){return s.replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
async function save(){try{const r=await fetch(SUPABASE_URL+'/rest/v1/flappy_scores',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({nickname:nick,score})});if(!r.ok)throw Error();statusEl.textContent='Результат сохранён.';loadScores();}catch{statusEl.textContent='Результат не сохранён: выполните SQL-настройку таблицы.'}}
function finish(){if(ended)return;playing=false;ended=true;save();overlay.innerHTML=`<div class="dialog"><h1>Полёт окончен</h1><p>${escapeHtml(nick)}, ваш счёт: <b>${score}</b></p><button id="again">Лететь снова</button></div>`;overlay.style.display='grid';document.querySelector('#again').onclick=()=>{reset();playing=true;ended=false;overlay.style.display='none';};}
form.addEventListener('submit',e=>{e.preventDefault();nick=nameEl.value.trim();if(!nick)return;reset();playing=true;overlay.style.display='none';});
addEventListener('keydown',e=>{if([' ','ArrowUp'].includes(e.key)){e.preventDefault();flap();}});c.addEventListener('pointerdown',flap);reset();loadScores();tick();
</script>
</body></html>
