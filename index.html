andom()*4)];pipes.push({x:565,y,col,pass:false});if(Math.random()<.8)badges.push({x:620,y:y+G/2})}pipes.forEach(p=>{p.x-=S;if(!p.pass&&p.x+W<bird.x){p.pass=true;score++;scoreEl.textContent=score}});badges.forEach(a=>{a.x-=S;if(!a.hit&&Math.hypot(a.x-bird.x,a.y-bird.y)<46){a.hit=true;score+=3;scoreEl.textContent=score}});pipes=pipes.filter(p=>p.x>-W);badges=badges.filter(a=>a.x>-40&&!a.hit);if(bird.y+bird.r>960||bird.y-bird.r<0||pipes.some(p=>bird.x+bird.r>p.x&&bird.x-bird.r<p.x+W&&(bird.y-bird.r<p.y||bird.y+bird.r>p.y+G)))finish()}render();requestAnimationFrame(tick)}async function flights(){let a=[],n=0;for(;;){let r=await fetch(U+'/rest/v1/flappy_scores?select=nickname,score',{headers:{...H,Range:`${n}-${n+999}`}});if(!r.ok)throw 0;let q=await r.json();a=a.concat(q);if(q.length<1000)return a;n+=1000}}async function load(){try{let m=new Map;(await flights()).forEach(a=>m.set(a.nickname,Math.max(m.get(a.nickname)||0,a.score)));let a=[...m].sort((a,b)=>b[1]-a[1]);leaders.innerHTML=a.length?a.map((v,i)=>`<li><b>${i+1}</b><span>${esc(v[0])}</span><strong>${v[1]}</strong></li>`).join(''):'<li>Полётов пока нет.</li>';status.textContent=`Игроков: ${a.length}`}catch{leaders.innerHTML='<li>Таблица пока не подключена.</li>'}}async function save(){try{await fetch(U+'/rest/v1/flappy_scores',{method:'POST',headers:H,body:JSON.stringify({nickname:nick,score})})}catch{}}function start(){reset();ended=false;playing=true;over.innerHTML='';home.style.display='none';view.classList.add('active');scrollTo(0,0)}document.querySelector('#form').onsubmit=e=>{e.preventDefault();nick=nickEl.value.trim();if(nick)start()};c.onpointerdown=flap;addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();flap()}});reset();load();tick();
